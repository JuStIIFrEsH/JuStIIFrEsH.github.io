<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Games · JuStIIFrEsH</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: #111827;
      --border: #29354a;
      --text: #f4f7fb;
      --muted: #9ba8ba;
      --accent: #58d9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(88,217,255,.12), transparent 28rem),
        linear-gradient(180deg, #0c111b, var(--bg));
    }
    main {
      width: min(100%, 680px);
    }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(2.6rem, 10vw, 4.8rem);
      letter-spacing: -.05em;
    }
    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      box-shadow: 0 20px 55px rgba(0,0,0,.3);
    }
    .card:hover { border-color: var(--accent); }
    .title {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
    }
    .copy {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.5;
    }
    .back {
      display: inline-block;
      margin-top: 22px;
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <a class="card" href="/Games/MMX%3AR/">
      <span class="title">MMX:R</span>
      <span class="copy">Launch Mega Man X Regenesis.</span>
    </a>
    <a class="back" href="/">← JuStIIFrEsH</a>
  </main>
</body>
</html>
