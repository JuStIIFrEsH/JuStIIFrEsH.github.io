<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Games · JuStIIFrEsH</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(5, 9, 16, .28);
      --panel-border: rgba(125, 211, 252, .16);
      --text: #f3f7ff;
      --muted: #9ca9bd;
      --cyan: #58d9ff;
      --violet: #a66cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(88,217,255,.14), transparent 26rem),
        radial-gradient(circle at 84% 8%, rgba(166,108,255,.14), transparent 30rem),
        linear-gradient(180deg, #090e18 0%, var(--bg) 72%);
    }

    main { width: min(100%, 680px); }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(2.6rem, 10vw, 4.8rem);
      letter-spacing: -.05em;
      text-shadow: 0 0 28px rgba(88,217,255,.1);
    }

    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(88,217,255,.028), transparent 38%),
        linear-gradient(315deg, rgba(166,108,255,.022), transparent 46%),
        var(--panel);
      color: var(--text);
      text-decoration: none;
      box-shadow:
        0 20px 55px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.03);
      backdrop-filter: blur(8px) saturate(108%);
      -webkit-backdrop-filter: blur(8px) saturate(108%);
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(88,217,255,.52);
      box-shadow:
        0 22px 58px rgba(0,0,0,.34),
        0 0 30px rgba(88,217,255,.08);
    }

    .title {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .copy {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.5;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: var(--cyan);
      text-decoration: none;
    }

    .back:hover { text-shadow: 0 0 16px rgba(88,217,255,.4); }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <a class="card" href="/Games/MMX%3AR/">
      <span class="title">MMX:R</span>
      <span class="copy">Launch Mega Man X Regenesis.</span>
    </a>
    <a class="back" href="/">← JuStIIFrEsH</a>
  </main>
</body>
</html>
