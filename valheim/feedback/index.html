<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Valheim Mod Feedback</title>
  <meta name="description" content="Send feedback or suggestions for JuStIIFrEsH Valheim mods.">
  <style>
    :root {
      --bg: #0d0f0e;
      --panel: rgba(22, 25, 23, 0.94);
      --panel-border: #3d403a;
      --text: #ece7db;
      --muted: #aaa79e;
      --accent: #d88a35;
      --accent-2: #f1b35f;
      --danger: #d86a5f;
      --success: #75b884;
      --field: #151816;
      --field-border: #4b4f48;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -15%, rgba(216, 138, 53, 0.16), transparent 42rem),
        linear-gradient(180deg, #111412 0%, var(--bg) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .shell {
      width: min(100%, 680px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
    }

    .mark {
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      border: 2px solid var(--accent);
      box-shadow: 0 0 18px rgba(216, 138, 53, 0.45);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: clamp(22px, 5vw, 38px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin: 12px 0 28px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 650;
      margin-bottom: 7px;
    }

    .optional {
      color: var(--muted);
      font-weight: 500;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      padding: 12px 13px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(216, 138, 53, 0.14);
    }

    textarea {
      resize: vertical;
      min-height: 170px;
      line-height: 1.45;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      min-height: 48px;
      padding: 12px 18px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #1b1209;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    }

    button:hover { filter: brightness(1.07); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .65; }

    #status {
      min-height: 1.4em;
      margin: 0;
      font-size: 0.9rem;
    }

    #status.success { color: var(--success); }
    #status.error { color: var(--danger); }

    .hp {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    @media (max-width: 580px) {
      .row { grid-template-columns: 1fr; }
      body { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <a href="/valheim/">Valheim Mod Support</a>
    </div>

    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Send Feedback</h1>
      <p class="intro">Have an idea, suggestion, or something you would like changed? Send it here.</p>

      <form id="feedback-form">
        <input type="hidden" name="access_key" value="931bc2a6-9788-4233-8f49-a386e14d3f9f">
        <input type="hidden" name="subject" value="New Valheim Mod Feedback">
        <input type="hidden" name="from_name" value="Valheim Feedback">

        <div class="hp" aria-hidden="true">
          <label for="botcheck">Leave this empty</label>
          <input type="checkbox" name="botcheck" id="botcheck" tabindex="-1" autocomplete="off">
        </div>

        <div class="row">
          <div>
            <label for="mod">Mod</label>
            <select id="mod" name="Mod" required>
              <option value="" selected disabled>Select a mod</option>
              <option value="FreshCommands">FreshCommands</option>
              <option value="FreshDedicatedStorage">FreshDedicatedStorage</option>
              <option value="General / All Mods">General / All Mods</option>
            </select>
          </div>

          <div>
            <label for="feedback-type">Feedback type</label>
            <select id="feedback-type" name="Feedback type" required>
              <option value="" selected disabled>Select a type</option>
              <option value="Feature request">Feature request</option>
              <option value="Suggestion">Suggestion</option>
              <option value="General feedback">General feedback</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label for="title">Subject</label>
          <input id="title" name="Feedback subject" type="text" maxlength="120" placeholder="Short summary" required>
        </div>

        <div>
          <label for="feedback">Feedback</label>
          <textarea id="feedback" name="Feedback" maxlength="5000" placeholder="Tell me what you think, what you would like added, or what could be improved." required></textarea>
        </div>

        <div>
          <label for="reporter-email">Your email <span class="optional">(optional)</span></label>
          <input id="reporter-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="Only if you want a reply">
          <div class="hint">Your email is sent privately with the feedback and is not displayed on this website.</div>
        </div>

        <button id="submit-button" type="submit">Send Feedback</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('feedback-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      status.className = '';
      status.textContent = 'Sending feedback…';
      button.disabled = true;

      try {
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Submission failed');
        }

        form.reset();
        status.className = 'success';
        status.textContent = 'Feedback sent. Thank you.';
      } catch (error) {
        status.className = 'error';
        status.textContent = 'The feedback could not be sent. Please try again in a moment.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
