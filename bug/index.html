<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mod Bug Report · JuStIIFrEsH</title>
  <meta name="description" content="Report a bug with a JuStIIFrEsH mod.">
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(5, 9, 16, .28);
      --panel-border: rgba(125, 211, 252, .16);
      --text: #f3f7ff;
      --muted: #9ca9bd;
      --cyan: #58d9ff;
      --blue: #6d7cff;
      --violet: #a66cff;
      --danger: #ff7b86;
      --success: #6ee7b7;
      --field: rgba(11, 16, 26, .76);
      --field-border: rgba(125, 211, 252, .19);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(88,217,255,.14), transparent 26rem),
        radial-gradient(circle at 84% 8%, rgba(166,108,255,.14), transparent 30rem),
        linear-gradient(180deg, #090e18 0%, var(--bg) 72%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .shell { width: min(100%, 680px); }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand a { color: inherit; text-decoration: none; }

    .mark {
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 18px rgba(88,217,255,.5);
    }

    .card {
      background:
        linear-gradient(135deg, rgba(88,217,255,.028), transparent 38%),
        linear-gradient(315deg, rgba(166,108,255,.022), transparent 46%),
        var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: clamp(22px, 5vw, 38px);
      box-shadow:
        0 24px 70px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.03);
      backdrop-filter: blur(8px) saturate(108%);
      -webkit-backdrop-filter: blur(8px) saturate(108%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      text-shadow: 0 0 28px rgba(88,217,255,.1);
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin: 12px 0 28px;
    }

    form { display: grid; gap: 18px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 650;
      margin-bottom: 7px;
    }

    .optional { color: var(--muted); font-weight: 500; }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      padding: 12px 13px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    select:disabled { opacity: .58; cursor: not-allowed; }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(88,217,255,.14);
      background: rgba(14,21,34,.88);
    }

    textarea {
      resize: vertical;
      min-height: 118px;
      line-height: 1.45;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    button {
      appearance: none;
      border: 1px solid rgba(88,217,255,.45);
      border-radius: 10px;
      min-height: 48px;
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--cyan), #87e9ff);
      color: #07131a;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease, box-shadow .12s ease;
    }

    button:hover {
      filter: brightness(1.05);
      box-shadow: 0 0 24px rgba(88,217,255,.13);
    }

    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .65; }

    #status {
      min-height: 1.4em;
      margin: 0;
      font-size: 0.9rem;
    }

    #status.success { color: var(--success); }
    #status.error { color: var(--danger); }

    .privacy {
      margin: 20px 0 0;
      padding-top: 18px;
      border-top: 1px solid rgba(125,211,252,.13);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .hp {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    @media (max-width: 580px) {
      .row { grid-template-columns: 1fr; }
      body { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <a href="/">JuStIIFrEsH Mod Support</a>
    </div>

    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Report a Bug</h1>
      <p class="intro">Found something that is not working correctly? Select the game and mod, then send a report below. The more detail you include, the easier it is to reproduce and fix.</p>

      <form id="bug-form">
        <input type="hidden" name="access_key" value="931bc2a6-9788-4233-8f49-a386e14d3f9f">
        <input type="hidden" name="subject" value="New Mod Bug Report">
        <input type="hidden" name="from_name" value="JuStIIFrEsH Bug Reporter">

        <div class="hp" aria-hidden="true">
          <label for="botcheck">Leave this empty</label>
          <input type="checkbox" name="botcheck" id="botcheck" tabindex="-1" autocomplete="off">
        </div>

        <div class="row">
          <div>
            <label for="game">Game</label>
            <select id="game" name="Game" required>
              <option value="" selected disabled>Select a game</option>
              <option value="Valheim">Valheim</option>
            </select>
          </div>

          <div>
            <label for="mod">Mod</label>
            <select id="mod" name="Mod" required disabled>
              <option value="" selected disabled>Select a game first</option>
            </select>
          </div>
        </div>

        <div>
          <label for="title">Bug title</label>
          <input id="title" name="Bug title" type="text" maxlength="120" placeholder="Short description of the problem" required>
        </div>

        <div>
          <label for="details">What happened?</label>
          <textarea id="details" name="What happened" maxlength="5000" placeholder="Describe the bug and what you expected to happen instead." required></textarea>
        </div>

        <div>
          <label for="steps">Steps to reproduce <span class="optional">(optional)</span></label>
          <textarea id="steps" name="Steps to reproduce" maxlength="5000" placeholder="1.&#10;2.&#10;3."></textarea>
        </div>

        <div class="row">
          <div>
            <label for="mod-version">Mod version <span class="optional">(optional)</span></label>
            <input id="mod-version" name="Mod version" type="text" maxlength="60" placeholder="e.g. 1.2.0">
          </div>
          <div>
            <label for="game-version">Game version <span class="optional">(optional)</span></label>
            <input id="game-version" name="Game version" type="text" maxlength="60" placeholder="Game version">
          </div>
        </div>

        <div>
          <label for="reporter-email">Your email <span class="optional">(optional)</span></label>
          <input id="reporter-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="Only if you want a reply">
          <div class="hint">Your email is sent privately with the report and is not displayed on this website.</div>
        </div>

        <button id="submit-button" type="submit">Submit Bug Report</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const modsByGame = {
      Valheim: ['FreshCommands', 'FreshDedicatedStorage']
    };

    const game = document.getElementById('game');
    const mod = document.getElementById('mod');
    const form = document.getElementById('bug-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');

    function populateMods(gameName) {
      mod.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.selected = true;
      placeholder.textContent = gameName ? 'Select a mod' : 'Select a game first';
      mod.appendChild(placeholder);

      const mods = modsByGame[gameName] || [];
      for (const modName of mods) {
        const option = document.createElement('option');
        option.value = modName;
        option.textContent = modName;
        mod.appendChild(option);
      }

      mod.disabled = mods.length === 0;
    }

    game.addEventListener('change', () => populateMods(game.value));

    const requestedGame = new URLSearchParams(window.location.search).get('game');
    if (requestedGame && modsByGame[requestedGame]) {
      game.value = requestedGame;
      populateMods(requestedGame);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      status.className = '';
      status.textContent = 'Sending report…';
      button.disabled = true;

      try {
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Submission failed');
        }

        form.reset();
        populateMods('');
        status.className = 'success';
        status.textContent = 'Bug report sent. Thank you.';
      } catch (error) {
        status.className = 'error';
        status.textContent = 'The report could not be sent. Please try again in a moment.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
