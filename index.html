<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>JuStIIFrEsH</title>
  <meta name="description" content="Gaming, automation, mods, tools, and projects by JuStIIFrEsH.">
  <link rel="canonical" href="https://justiifresh.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JuStIIFrEsH">
  <meta property="og:title" content="JuStIIFrEsH">
  <meta property="og:description" content="Gaming, automation, mods, tools, and projects by JuStIIFrEsH.">
  <meta property="og:url" content="https://justiifresh.com/">
  <meta property="og:image" content="https://justiifresh.com/assets/justiifresh-link-preview.jpg">
  <meta property="og:image:secure_url" content="https://justiifresh.com/assets/justiifresh-link-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="315">
  <meta property="og:image:alt" content="JuStIIFrEsH — Gaming, Automation, Mods, Tools">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JuStIIFrEsH">
  <meta name="twitter:description" content="Gaming, automation, mods, tools, and projects by JuStIIFrEsH.">
  <meta name="twitter:image" content="https://justiifresh.com/assets/justiifresh-link-preview.jpg">
  <meta name="twitter:image:alt" content="JuStIIFrEsH — Gaming, Automation, Mods, Tools">
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(11, 16, 26, .76);
      --panel-border: rgba(125, 211, 252, .22);
      --text: #f3f7ff;
      --muted: #9ca9bd;
      --cyan: #58d9ff;
      --blue: #6d7cff;
      --violet: #a66cff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(88,217,255,.16), transparent 24rem),
        radial-gradient(circle at 82% 12%, rgba(166,108,255,.16), transparent 28rem),
        radial-gradient(circle at 50% 105%, rgba(109,124,255,.14), transparent 32rem),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(88,217,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,217,255,.055) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), transparent 82%);
      transform: perspective(650px) rotateX(58deg) scale(1.45) translateY(14%);
      transform-origin: center bottom;
      opacity: .7;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.014) 0,
        rgba(255,255,255,.014) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
      opacity: .45;
    }

    .orb {
      position: fixed;
      width: 340px;
      height: 340px;
      border: 1px solid rgba(88,217,255,.16);
      border-radius: 50%;
      right: -150px;
      top: 18%;
      box-shadow:
        0 0 0 34px rgba(88,217,255,.025),
        0 0 0 70px rgba(166,108,255,.018),
        0 0 90px rgba(88,217,255,.08);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 920px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(56px, 10vh, 110px) 22px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      margin-bottom: 18px;
      color: var(--cyan);
      font: 700 .76rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(3.4rem, 12vw, 7rem);
      line-height: .88;
      letter-spacing: -.065em;
      text-shadow: 0 0 34px rgba(88,217,255,.12);
    }

    .tagline {
      max-width: 600px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }

    .links {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      margin-top: 38px;
      max-width: 620px;
    }

    .card {
      position: relative;
      display: block;
      overflow: hidden;
      padding: 22px 24px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      background:
        linear-gradient(135deg, rgba(88,217,255,.075), transparent 44%),
        linear-gradient(315deg, rgba(166,108,255,.07), transparent 50%),
        var(--panel);
      box-shadow:
        0 18px 48px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(14px);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .card::after {
      content: "→";
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cyan);
      font-size: 1.7rem;
      text-shadow: 0 0 16px rgba(88,217,255,.65);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(88,217,255,.55);
      box-shadow:
        0 22px 58px rgba(0,0,0,.38),
        0 0 34px rgba(88,217,255,.08);
    }

    .card-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--cyan);
      font: 700 .72rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .card-title {
      display: block;
      margin-right: 46px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .card-copy {
      display: block;
      margin: 6px 54px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: .95rem;
    }

    .corner {
      position: fixed;
      left: 22px;
      bottom: 18px;
      z-index: 1;
      color: rgba(156,169,189,.55);
      font: 600 .68rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      main { justify-content: flex-start; padding-top: 78px; }
      h1 { font-size: clamp(3.1rem, 18vw, 5rem); }
      .card-copy { margin-right: 34px; }
      .orb { width: 250px; height: 250px; right: -130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <main>
    <div class="status">Player One // Online</div>
    <h1>JuStIIFrEsH</h1>
    <p class="tagline">Games, mods, and experiments built for fun.</p>

    <nav class="links" aria-label="Projects">
      <a class="card" href="/valheim/">
        <span class="card-kicker">Mods</span>
        <span class="card-title">Valheim</span>
        <span class="card-copy">Browse mods, source code, releases on Thunderstore, Hexium, and Nexus Mods, plus bug reporting and feedback.</span>
      </a>
    </nav>
  </main>
  <div class="corner">System Ready</div>
</body>
</html>
