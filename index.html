<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>JuStIIFrEsH</title>
  <meta name="description" content="Gaming, automation, mods, tools, and projects by JuStIIFrEsH.">
  <link rel="canonical" href="https://justiifresh.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JuStIIFrEsH">
  <meta property="og:title" content="JuStIIFrEsH">
  <meta property="og:description" content="Gaming, automation, mods, tools, and projects by JuStIIFrEsH.">
  <meta property="og:url" content="https://justiifresh.com/">
  <meta property="og:image" content="https://justiifresh.com/assets/justiifresh-link-preview.jpg">
  <meta property="og:image:secure_url" content="https://justiifresh.com/assets/justiifresh-link-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="315">
  <meta property="og:image:alt" content="JuStIIFrEsH — Gaming, Automation, Mods, Tools">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JuStIIFrEsH">
  <meta name="twitter:description" content="Gaming, automation, mods, tools, and projects by JuStIIFrEsH.">
  <meta name="twitter:image" content="https://justiifresh.com/assets/justiifresh-link-preview.jpg">
  <meta name="twitter:image:alt" content="JuStIIFrEsH — Gaming, Automation, Mods, Tools">
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(11, 16, 26, .76);
      --panel-border: rgba(125, 211, 252, .22);
      --text: #f3f7ff;
      --muted: #9ca9bd;
      --cyan: #58d9ff;
      --blue: #6d7cff;
      --violet: #a66cff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(90deg, rgba(5,7,11,.34) 0%, rgba(5,7,11,.12) 48%, rgba(5,7,11,.24) 100%),
        url("/justiifresh.com%20background.png") center center / cover fixed no-repeat,
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(5,7,11,.02) 0%,
        rgba(5,7,11,.08) 55%,
        rgba(5,7,11,.24) 100%
      );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.014) 0,
        rgba(255,255,255,.014) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
      opacity: .45;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 920px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(56px, 10vh, 110px) 22px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content-panel {
      width: min(100%, 700px);
      padding: clamp(26px, 4vw, 42px);
      border: 1px solid rgba(125, 211, 252, .18);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(88,217,255,.055), transparent 38%),
        linear-gradient(315deg, rgba(166,108,255,.045), transparent 46%),
        rgba(5, 9, 16, .58);
      box-shadow:
        0 24px 70px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(16px) saturate(115%);
      -webkit-backdrop-filter: blur(16px) saturate(115%);
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(3.4rem, 12vw, 7rem);
      line-height: .88;
      letter-spacing: -.065em;
      text-shadow: 0 0 34px rgba(88,217,255,.12);
    }

    .tagline {
      max-width: 600px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }

    .links {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      margin-top: 38px;
      max-width: 620px;
    }

    .card {
      position: relative;
      display: block;
      overflow: hidden;
      padding: 22px 24px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      background:
        linear-gradient(135deg, rgba(88,217,255,.075), transparent 44%),
        linear-gradient(315deg, rgba(166,108,255,.07), transparent 50%),
        var(--panel);
      box-shadow:
        0 18px 48px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(14px);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .card::after {
      content: "→";
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cyan);
      font-size: 1.7rem;
      text-shadow: 0 0 16px rgba(88,217,255,.65);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(88,217,255,.55);
      box-shadow:
        0 22px 58px rgba(0,0,0,.38),
        0 0 34px rgba(88,217,255,.08);
    }

    .card-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--cyan);
      font: 700 .72rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .card-title {
      display: block;
      margin-right: 46px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .card-copy {
      display: block;
      margin: 6px 54px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: .95rem;
    }

    @media (max-width: 520px) {
      main { justify-content: flex-start; padding-top: 78px; }
      .content-panel { padding: 24px 20px; border-radius: 20px; }
      h1 { font-size: clamp(3.1rem, 18vw, 5rem); }
      .card-copy { margin-right: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="content-panel">
      <h1>JuStIIFrEsH</h1>
      <p class="tagline">Games, mods, and experiments built for fun.</p>

      <nav class="links" aria-label="Projects">
        <a class="card" href="/valheim/">
          <span class="card-kicker">Mods</span>
          <span class="card-title">Valheim</span>
          <span class="card-copy">Browse mods, source code, releases on Thunderstore, Hexium, and Nexus Mods, plus bug reporting and feedback.</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
